services:
  # MySQL数据库服务
  mysql:
    image: mysql:8.0
    container_name: stock-mysql
    environment:
      MYSQL_ROOT_PASSWORD: stock_root_2024
      MYSQL_DATABASE: stock_data
      MYSQL_USER: stock_user
      MYSQL_PASSWORD: stock_pass_2024
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pstock_root_2024"]
      timeout: 20s
      interval: 10s
      retries: 10
    networks:
      - stock-network

  # Web后台服务 (Flask API)
  web-backend:
    build:
      context: .
      dockerfile: Dockerfile.combined
    container_name: stock-backend
    ports:
      - "5000:5000"
    environment:
      - MYSQL_HOST=stock-mysql
      - MYSQL_USER=stock_user
      - MYSQL_PWD=stock_pass_2024
      - MYSQL_DB=stock_data
      - TZ=Asia/Shanghai
      - FLASK_ENV=production
      - DATABASE_URL=mysql+pymysql://stock_user:stock_pass_2024@stock-mysql:3306/stock_data
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    networks:
      - stock-network
    restart: unless-stopped

  # Web前端服务 (UmiJS)
  web-ui:
    image: sawcao/umi-stock-ui:latest
    container_name: stock-webui
    ports:
      - "8888:9090"
    environment:
      - NODE_ENV=production
      - REACT_APP_API_URL=http://localhost:5000
    # depends_on:
    #   - web-backend
    volumes:
      - ./web/umi-stock/logs:/app/logs
    networks:
      - stock-network
    restart: unless-stopped


  # Redis缓存服务
  redis:
    image: redis:7-alpine
    container_name: stock-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 20s
      interval: 10s
      retries: 10
    networks:
      - stock-network

volumes:
  mysql_data:
  redis_data:

networks:
  stock-network:
    driver: bridge
